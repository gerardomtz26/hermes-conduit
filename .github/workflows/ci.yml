name: CI

# CI v3 - two gates, one purpose each (see docs/CI.md):
#
#   GitHub-hosted (this file)     clean-machine BROAD SMOKE safety net for every
#                                 PR, including public/fork PRs: compile the
#                                 whole app and all test targets, run the cheap
#                                 Linux validation, then a curated
#                                 representative slice of unit and UI classes on
#                                 macOS. It answers "does this build, and is
#                                 anything obviously broken?" and nothing else.
#
#   Mac local exhaustive gate     TRUSTED-HEAD correctness gate for a release
#                                 or a risky merge: the COMPLETE unit and UI
#                                 suites, the timing/performance/dormancy
#                                 families with unconditional repeats, and
#                                 bounded infrastructure recovery.
#                                 `scripts/local-ci-gate.sh` - never GitHub
#                                 runners.
#
# Jobs:
#   plan       (ubuntu)  inventory/planner validation, localization coverage,
#                        CI-tooling tests, and the smoke SELECTION
#                        (scripts/smoke-suite.json, validated against the
#                        discovered inventory so a rename cannot silently
#                        shrink hosted coverage).
#   self-test  (ubuntu)  the CI-tooling regression suites, including the
#                        minutes-long bash state machines.
#   build      (macos)   build-for-testing exactly once; audit the .xctestrun
#                        for absolute-path portability; upload the products.
#   unit-smoke (macos)   the curated unit classes, ONE invocation.
#   ui-smoke   (macos)   the curated UI classes, ONE invocation.
#   ci-gate    (ubuntu)  the single stable branch-protection check.
#
# Deliberately NOT here: dynamic lane fanout, timing-history EWMA machinery and
# Xcode-native flake retry (-test-iterations). The smoke suite is small enough
# that per-batch watchdogs and lane balancing buy nothing, and a genuine
# assertion must fail the run rather than be re-run until it agrees. The Mac
# gate owns repeats, recovery and the timing families.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Known simulator, used directly as the xcodebuild destination - no
  # 'simctl list' enumeration on the happy path. macos-26 images ship the
  # iPhone 17 family; override here if an image refresh renames devices.
  SIMULATOR_NAME: "iPhone 17 Pro"
  # Workspace-anchored DerivedData: GITHUB_WORKSPACE is byte-identical across
  # GitHub-hosted runners for this repo (/Users/runner/work/<repo>/<repo>),
  # so absolute paths inside the .xctestrun stay valid after the artifact
  # round-trip - no path rewriting involved.
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  plan:
    name: Plan & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unit-csv: "${{ steps.smoke.outputs.unit-csv }}"
      ui-csv: "${{ steps.smoke.outputs.ui-csv }}"
    steps:
      - uses: actions/checkout@v7

      - name: Validate inventory + planner regression tests
        env:
          # The minutes-long bash meta-suites (lane-runner state machine,
          # destination lookup) run in the dedicated self-test job - they must
          # never delay planning or risk this job's timeout.
          CONDUIT_CI_SKIP_BASH_WRAPPER_TESTS: "1"
        run: |
          set -euo pipefail
          # The planner still owns inventory discovery and is what the Mac
          # exhaustive gate balances with, so its own completeness invariant
          # (every discovered XCTestCase class planned exactly once) is checked
          # on every run.
          python3 scripts/plan-tests.py validate --repo-root . \
            --baseline scripts/test-timings.json
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Localization catalog coverage
        # Cheap Linux guard: every String(localized:) / SwiftUI literal call
        # site must resolve to a key in Conduit/Localizable.xcstrings, so a
        # translated string can never silently render English again.
        run: python3 scripts/check-l10n-coverage.py --repo-root .

      - name: Select the hosted smoke suite
        id: smoke
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python3 scripts/plan-tests.py smoke --repo-root . \
            --suite scripts/smoke-suite.json --out ci-artifacts/smoke.json
          echo "unit-csv=$(jq -r '.unit_csv' ci-artifacts/smoke.json)" >> "$GITHUB_OUTPUT"
          echo "ui-csv=$(jq -r '.ui_csv' ci-artifacts/smoke.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke selection summary
        run: |
          set -euo pipefail
          python3 scripts/smoke-summary.py \
            --selection ci-artifacts/smoke.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke selection
        uses: actions/upload-artifact@v4
        with:
          name: smoke-selection
          path: ci-artifacts/
          retention-days: 7

  self-test:
    name: CI tooling self-test
    # No `needs`: the meta-suites test the CI tooling itself, not this run's
    # selection, so they start immediately and run CONCURRENTLY with the macOS
    # build instead of serially delaying it.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Run CI tooling regression suites
        # Full discovery INCLUDING the bash state-machine suites. The timeout
        # layering must hold: per-case synthetic-hang watchdogs (<= 6s) < the
        # wrapper's subprocess cap (480s) < this job ceiling (12m) - GitHub must
        # never be the first layer to kill a regression suite.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  build:
    name: Build test products
    needs: plan
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing (exactly once)
        env:
          BUILD_TIMEOUT_SECS: 900
        run: bash scripts/ci-build-for-testing.sh

      - name: Audit .xctestrun portability
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Prune intermediates from the products tree
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH/Build/Intermediates.noindex" \
                 "$DERIVED_DATA_PATH/Index" \
                 "$DERIVED_DATA_PATH/Logs"

      - name: Upload build products (consumed by both smoke jobs)
        # Relative path (relative to the source root, where the build script
        # wrote it); the artifact keeps the Build/... structure, and the smoke
        # jobs restore it under $DERIVED_DATA_PATH/Build so the .xctestrun's
        # absolute paths hold.
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: ci-derived-data/Build
          retention-days: 1
          if-no-files-found: error

  unit-smoke:
    name: Unit smoke
    needs: [plan, build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Run the curated unit smoke suite
        # The curated classes run as SEQUENTIAL batches of at most
        # $SMOKE_BATCH_SIZE inside this one job, never as a single invocation:
        # large single invocations repeatedly watchdog-stalled on hosted
        # macos-26 (docs/CI.md, "Sequential unit batches"), which is why the lane
        # runner batches too. No native flake retry and no recovery here - a
        # genuine assertion must fail this job; repeats and bounded recovery are
        # the Mac gate's business.
        env:
          UNIT_CLASSES: "${{ needs.plan.outputs.unit-csv }}"
          SMOKE_BATCH_SIZE: "8"
        run: |
          set -euo pipefail
          # Fail closed: an empty list would expand to no -only-testing filter,
          # and a bare xcodebuild would run the ENTIRE suite instead of nothing.
          if [ -z "$UNIT_CLASSES" ]; then
            echo "::error::unit smoke selection is empty - refusing to run unfiltered"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UNIT_CLASSES"
          echo "unit smoke: ${#CLASSES[@]} classes, batches of at most $SMOKE_BATCH_SIZE"

          run_batch() {
            batch_no="$1"
            shift
            if [ "$#" -eq 0 ]; then
              return 0
            fi
            batch_args=()
            for cls in "$@"; do
              batch_args+=("-only-testing:ConduitTests/${cls}")
            done
            echo "::group::unit smoke batch $batch_no ($# classes)"
            xcodebuild test-without-building \
              -xctestrun "$XCRUN_FILE" \
              -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
              -parallel-testing-enabled NO \
              "${batch_args[@]}"
            echo "::endgroup::"
          }

          batch=0
          group=()
          for cls in "${CLASSES[@]}"; do
            group+=("$cls")
            if [ "${#group[@]}" -ge "$SMOKE_BATCH_SIZE" ]; then
              batch=$((batch + 1))
              run_batch "$batch" "${group[@]}"
              group=()
            fi
          done
          if [ "${#group[@]}" -gt 0 ]; then
            batch=$((batch + 1))
            run_batch "$batch" "${group[@]}"
          fi
          echo "unit smoke: $batch batch invocation(s) completed"

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

  ui-smoke:
    name: UI smoke
    needs: [plan, build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Run the curated UI smoke suite
        # Basic launch/navigation smoke only: the full UI suite is certified by
        # the Mac local gate.
        env:
          UI_CLASSES: "${{ needs.plan.outputs.ui-csv }}"
        run: |
          set -euo pipefail
          # Fail closed: an empty list would expand to no -only-testing filter,
          # and a bare xcodebuild would run the ENTIRE UI suite instead of the
          # two curated classes.
          if [ -z "$UI_CLASSES" ]; then
            echo "::error::UI smoke selection is empty - refusing to run unfiltered"
            exit 1
          fi
          IFS=',' read -r -a CLASSES <<< "$UI_CLASSES"
          ARGS=()
          for cls in "${CLASSES[@]}"; do
            ARGS+=("-only-testing:ConduitUITests/${cls}")
          done
          echo "UI smoke: ${#CLASSES[@]} classes"
          xcodebuild test-without-building \
            -xctestrun "$XCRUN_FILE" \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -parallel-testing-enabled NO \
            "${ARGS[@]}"

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

  # Single stable branch-protection check. The smoke jobs are the safety net;
  # the exhaustive verdict for a release comes from the Mac local gate, which
  # never runs on GitHub runners.
  ci-gate:
    name: CI Gate
    needs: [plan, build, unit-smoke, ui-smoke, self-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Enforce final CI verdict
        run: |
          python3 scripts/ci-gate.py \
            --plan "${{ needs.plan.result }}" \
            --build "${{ needs.build.result }}" \
            --unit-smoke "${{ needs.unit-smoke.result }}" \
            --ui-smoke "${{ needs.ui-smoke.result }}" \
            --self-test "${{ needs.self-test.result }}"
