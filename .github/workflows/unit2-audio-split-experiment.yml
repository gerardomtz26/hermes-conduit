name: Unit-2 audio split experiment

# One-off diagnostic: take the normal planner's current unit-2 assignment and
# run its Audio/Voice/CarPlay classes separately from the rest on the same
# standard macos-26 runner image.  Nothing in the production CI workflow is
# changed by this experiment.

on:
  push:
    branches:
      - ci/unit2-audio-split-experiment

concurrency:
  group: unit2-audio-split-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIMULATOR_NAME: "iPhone 17 Pro"
  DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"

jobs:
  plan-experiment:
    name: Plan unit-2 split
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: "${{ steps.split.outputs.matrix }}"
    steps:
      - uses: actions/checkout@v7

      - name: Restore timing history
        uses: actions/cache/restore@v4
        with:
          path: ci-timing
          key: timing-history-v1-${{ github.run_number }}
          restore-keys: |
            timing-history-v1-

      - name: Generate normal execution plan
        run: |
          set -euo pipefail
          HISTORY_ARG=""
          if [ -f ci-timing/timing-history.json ]; then
            HISTORY_ARG="--history ci-timing/timing-history.json"
          fi
          mkdir -p ci-artifacts
          python3 scripts/plan-tests.py plan --repo-root . \
            --baseline scripts/test-timings.json $HISTORY_ARG \
            --out ci-artifacts/plan.json \
            --matrix-out ci-artifacts/unit-matrix.json \
            --ui-matrix-out ci-artifacts/ui-matrix.json \
            --summary-out ci-artifacts/plan-summary.md

      - name: Split only unit-2
        id: split
        run: |
          set -euo pipefail
          python3 scripts/split-unit2-experiment.py \
            --input ci-artifacts/unit-matrix.json \
            --output ci-artifacts/unit2-experiment-matrix.json \
            --summary ci-artifacts/unit2-experiment-summary.md
          echo "matrix=$(jq -c . ci-artifacts/unit2-experiment-matrix.json)" >> "$GITHUB_OUTPUT"
          cat ci-artifacts/plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-artifacts/unit2-experiment-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment plan
        uses: actions/upload-artifact@v4
        with:
          name: unit2-experiment-plan
          path: ci-artifacts/
          retention-days: 7

  build:
    name: Build test products
    needs: plan-experiment
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing (exactly once)
        env:
          BUILD_TIMEOUT_SECS: 900
        run: bash scripts/ci-build-for-testing.sh

      - name: Audit .xctestrun portability
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Prune intermediates from the products tree
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH/Build/Intermediates.noindex" \
                 "$DERIVED_DATA_PATH/Index" \
                 "$DERIVED_DATA_PATH/Logs"

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: unit2-experiment-build-products
          path: ci-derived-data/Build
          retention-days: 1
          if-no-files-found: error

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit2-experiment-build-meta
          path: ci-lane/build/
          retention-days: 7
          if-no-files-found: ignore

  unit2-split:
    name: "Experiment - ${{ matrix.lane }}"
    needs: [plan-experiment, build]
    runs-on: macos-26
    timeout-minutes: ${{ matrix.job_timeout_min }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-experiment.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download shared build products
        uses: actions/download-artifact@v4
        with:
          name: unit2-experiment-build-products
          path: "${{ env.DERIVED_DATA_PATH }}/Build"

      - name: Verify restored .xctestrun paths
        run: |
          set -euo pipefail
          XCRUN_FILE=$(ls -t "$DERIVED_DATA_PATH"/Build/Products/*.xctestrun | head -n 1)
          echo "XCRUN_FILE=$XCRUN_FILE" >> "$GITHUB_ENV"
          python3 scripts/plan-tests.py audit-xctestrun \
            --xctestrun "$XCRUN_FILE" --workspace-root "$GITHUB_WORKSPACE"

      - name: Run experimental unit lane
        env:
          CLASS_TIMEOUT_MIN_S: "180"
          CLASS_TIMEOUT_MULTIPLIER: "4.0"
          CONDUIT_PERF_TRACE: "1"
          LANE_NAME: "${{ matrix.lane }}"
          LANE_TARGET: "${{ matrix.target }}"
          LANE_CLASSES: "${{ matrix.classes }}"
          LANE_CLASS_ESTIMATES: "${{ matrix.class_estimates }}"
          LANE_PREDICTED: "${{ matrix.predicted_s }}"
          LANE_TIMEOUT: "${{ matrix.timeout_s }}"
        run: |
          bash scripts/ci-test-lane.sh \
            --kind unit \
            --lane "$LANE_NAME" \
            --target "$LANE_TARGET" \
            --classes "$LANE_CLASSES" \
            --class-estimates "$LANE_CLASS_ESTIMATES" \
            --predicted "$LANE_PREDICTED" \
            --timeout "$LANE_TIMEOUT" \
            --iterations 3 \
            --xctestrun "$XCRUN_FILE" \
            --result-dir "ci-lane/$LANE_NAME"

      - name: Dump simulator state (failure diagnostics)
        if: failure()
        run: |
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available

      - name: Upload experiment lane results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.lane }}
          path: ci-lane/
          retention-days: 7
          if-no-files-found: error
